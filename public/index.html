<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- maximum-scale stops iPhone Safari zooming in when a weight or reps box is tapped.
         viewport-fit=cover exposes the safe-area insets, so the tab bar sits above the
         home indicator when Flex Up is opened from the home screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Log every set, beat your PBs and share your workouts." />
    <meta name="theme-color" content="#F4F4F0" />
    <!-- "Add to Home Screen" on iPhone: own icon, opens full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flex Up" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- ?v= changes whenever the icon does, so iPhones don't reuse a cached old icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=4" />
    <link rel="manifest" href="/manifest.json?v=4" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      /* --app-height is the height actually visible (set by the script below). Opened from the
         iPhone home screen, "100%" can come out taller than the screen and push the tab bar
         off the bottom. */
      html,
      body {
        height: 100%;
        height: var(--app-height, 100%);
        background-color: #F4F4F0;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // Size the app to the visible area, and keep it right on rotation or when the toolbar moves.
      (function () {
        function fit() {
          var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
          document.documentElement.style.setProperty('--app-height', Math.round(h) + 'px');
        }
        fit();
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', fit);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
      })();
    </script>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
