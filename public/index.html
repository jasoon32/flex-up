<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- maximum-scale stops iPhone Safari zooming in when a weight or reps box is tapped.
         viewport-fit=cover exposes the safe-area insets, so the tab bar sits above the
         home indicator when Flex Up is opened from the home screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Log every set, beat your PBs and share your workouts." />
    <meta name="theme-color" content="#F4F4F0" />
    <!-- "Add to Home Screen" on iPhone: own icon, opens full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flex Up Pro" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- ?v= changes whenever the icon does, so iPhones don't reuse a cached old icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=5" />
    <link rel="manifest" href="/manifest.json?v=5" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #F4F4F0;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
        /* iPhone: holding a finger on text (like a set number, to delete the set) shouldn't
           select it or pop up Copy / Look Up and swallow the long-press. */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      /* The app is pinned to the four edges of the visible screen. Opened from the iPhone home
         screen, "height: 100%" can come out taller than what's visible and push the tab bar off
         the bottom; a fixed box with top/bottom 0 is sized by what's actually on screen. */
      #root {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        flex-direction: column;
      }
    </style>
    <script>
      // After rotating, iPhone can leave a home-screen web app scrolled or zoomed so it looks
      // frozen. The app never scrolls the page itself (everything scrolls inside #root), so snap
      // the page back to the top-left once the rotation or resize settles.
      // The safe-area insets are measured on "resize", which iPhone fires mid-rotation while the
      // page is still offset; that left a big gap at the top and the tab bar over the home
      // indicator. A second "resize" once things have settled makes them be measured again.
      (function () {
        var t, again, ours = false;
        function settle() {
          if (ours) return;
          clearTimeout(t);
          clearTimeout(again);
          t = setTimeout(function () {
            if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
            remeasure();
          }, 150);
          again = setTimeout(remeasure, 700);
        }
        function remeasure() {
          ours = true;
          window.dispatchEvent(new Event('resize'));
          ours = false;
        }
        window.addEventListener('orientationchange', settle);
        window.addEventListener('resize', settle);
      })();
    </script>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
