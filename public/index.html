<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- maximum-scale stops iPhone Safari zooming in when a weight or reps box is tapped.
         viewport-fit=cover exposes the safe-area insets, so the tab bar sits above the
         home indicator when Flex Up is opened from the home screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Log every set, beat your PBs and share your workouts." />
    <meta name="theme-color" content="#F4F4F0" />
    <!-- "Add to Home Screen" on iPhone: own icon, opens full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flex Up" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- ?v= changes whenever the icon does, so iPhones don't reuse a cached old icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=4" />
    <link rel="manifest" href="/manifest.json?v=4" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #F4F4F0;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* The app is pinned to the four edges of the visible screen. Opened from the iPhone home
         screen, "height: 100%" can come out taller than what's visible and push the tab bar off
         the bottom; a fixed box with top/bottom 0 is sized by what's actually on screen. */
      #root {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
